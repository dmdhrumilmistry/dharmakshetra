<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dharmakshetra - a game of realms</title>
  <meta name="description" content="Trade realms, raise temples and outlast your rivals in a board game set in the world of the Mahabharata. Play solo against sages or with friends, peer to peer.">
  <meta name="theme-color" content="#17224A">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <!-- Home -->
    <section id="screen-home" class="screen" hidden>
      <div class="home">
        <div class="home-art" aria-hidden="true"></div>
        <div class="home-panel">
          <p class="verse">dharmakshetre kurukshetre samaveta yuyutsavah</p>
          <h1 class="logo">Dharmakshetra</h1>
          <p class="lede">Trade realms, raise temples and outlast your rivals across the kingdoms of the Mahabharata.</p>

          <label class="field">
            <span>Your name</span>
            <input id="home-name" maxlength="16" autocomplete="nickname" placeholder="Name shown to other players">
          </label>

          <div class="field">
            <span>Your character</span>
            <div id="home-chars" class="char-grid" role="radiogroup" aria-label="Choose your character"></div>
            <p id="home-char-power" class="power-note"></p>
          </div>

          <div class="home-actions">
            <button id="btn-local" class="btn primary">Play on this device</button>
            <button id="btn-host" class="btn">Host an online game</button>
          </div>
          <form id="join-form" class="join">
            <input id="join-code" maxlength="8" placeholder="Room code" aria-label="Room code" autocomplete="off" spellcheck="false">
            <button class="btn">Join game</button>
          </form>
          <button id="btn-resume" class="link" hidden>Resume your saved game</button>
          <button id="btn-rules" class="link">How to play</button>
        </div>
      </div>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="screen" hidden>
      <div class="lobby">
        <header class="lobby-head">
          <button id="lobby-back" class="link">Leave</button>
          <h2 class="lobby-title">Gathering at the Sabha</h2>
          <div id="lobby-room" class="room" hidden>
            <span>Room code</span>
            <strong id="lobby-code"></strong>
            <button id="lobby-copy" class="btn small">Copy invite link</button>
          </div>
          <p id="lobby-status" class="status-line"></p>
        </header>
        <ul id="lobby-seats" class="seats"></ul>
        <div class="lobby-actions">
          <button id="lobby-add-human" class="btn" hidden>Add a player on this device</button>
          <button id="lobby-add-bot" class="btn" hidden>Add a computer player</button>
          <button id="lobby-start" class="btn primary" hidden>Begin the game</button>
        </div>
        <div id="lobby-chat" class="chat" hidden>
          <ul id="lobby-chat-list" class="chat-list"></ul>
          <form class="chat-form"><input maxlength="200" placeholder="Say something to the Sabha" aria-label="Chat message"><button class="btn small">Send</button></form>
        </div>
      </div>
    </section>

    <!-- Game -->
    <section id="screen-game" class="screen" hidden>
      <header class="topbar">
        <span class="logo small">Dharmakshetra</span>
        <span id="top-room" class="top-room"></span>
        <span id="net-status" class="net-status" hidden></span>
        <nav class="top-actions">
          <button id="btn-trade" class="btn small">Trade</button>
          <button id="btn-sound" class="btn small" aria-pressed="true">Sound on</button>
          <button id="btn-menu" class="btn small">Menu</button>
        </nav>
      </header>
      <main class="table">
        <div class="board-wrap">
          <div id="board" class="board"></div>
        </div>
        <aside class="side">
          <section class="panel">
            <h3>Players</h3>
            <ul id="players" class="players"></ul>
          </section>
          <section class="panel">
            <h3 id="realms-title">Your realms</h3>
            <div id="realms" class="realms"></div>
          </section>
          <section class="panel chronicle">
            <h3>Chronicle</h3>
            <ul id="log" class="log"></ul>
            <form id="game-chat" class="chat-form" hidden><input maxlength="200" placeholder="Message everyone" aria-label="Chat message"><button class="btn small">Send</button></form>
          </section>
        </aside>
      </main>
    </section>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-back"></div>
    <div class="modal-box" role="dialog" aria-modal="true"></div>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
